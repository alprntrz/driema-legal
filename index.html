<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driema - Dream Journal</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #311B92 0%, #5E35B1 100%);
    color: #FFFFFF;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.container {
    max-width: 600px;
    text-align: center;
}

.logo {
    font-size: 80px;
    margin-bottom: 16px;
}

h1 {
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -1px;
}

.subtitle {
    color: #DDD5F0;
    font-size: 18px;
    margin-bottom: 40px;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 320px;
    margin: 0 auto;
}

.link {
    display: block;
    padding: 16px 24px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s;
}

.link:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
}

.footer {
    margin-top: 60px;
    color: #B5B0CC;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="container">
    <div class="logo">✨</div>
    <h1>Driema</h1>
    <div class="subtitle">Your Personal Dream Journal</div>

    <div class="links">
        <a href="./privacy.html" class="link">Privacy Policy</a>
        <a href="./terms.html" class="link">Terms of Service</a>
        <a href="mailto:alperenterzi7+driema@gmail.com" class="link">Contact Support</a>
    </div>

    <div class="footer">
        © 2026 Driema · Made with ♡ in Turkey
    </div>
</div>
</body>
</html>
